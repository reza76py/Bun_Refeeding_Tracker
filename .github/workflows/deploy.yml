name: Deploy Refeeding Tracker

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on production server
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} bash << EOF
            {
              echo "DJANGO_DEBUG=false"
              echo "DJANGO_SECRET_KEY=${SECRET_KEY}"
              echo "DJANGO_ALLOWED_HOSTS=refeeding.rezteche.com"
              echo "DJANGO_CSRF_TRUSTED_ORIGINS=https://refeeding.rezteche.com"
              echo "DJANGO_SECURE_COOKIES=true"
              echo "DB_ENGINE=sqlite"
              echo "DB_NAME=/app/data/db.sqlite3"
            } > /var/www/refeeding-tracker/.env
            chmod 600 /var/www/refeeding-tracker/.env
            cd /var/www/refeeding-tracker
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy.sh
            bash deploy.sh
          EOF
