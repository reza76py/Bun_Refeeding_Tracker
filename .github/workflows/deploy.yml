name: Deploy Refeeding Tracker

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/reza76py/bun_refeeding_tracker-backend:latest
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/reza76py/bun_refeeding_tracker-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy on production server (pull only, no build)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash << EOF
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            {
              echo "DJANGO_DEBUG=false"
              echo "DJANGO_SECRET_KEY=${{ secrets.SECRET_KEY }}"
              echo "DJANGO_ALLOWED_HOSTS=refeeding.rezteche.com"
              echo "DJANGO_CSRF_TRUSTED_ORIGINS=https://refeeding.rezteche.com"
              echo "DJANGO_SECURE_COOKIES=true"
              echo "DB_ENGINE=mysql"
              echo "DB_HOST=db"
              echo "DB_PORT=3306"
              echo "DB_NAME=refeeding"
              echo "DB_USER=refeeding"
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            } > /var/www/refeeding-tracker/.env
            chmod 600 /var/www/refeeding-tracker/.env
            cd /var/www/refeeding-tracker
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput
            docker logout ghcr.io
            docker compose -f docker-compose.prod.yml ps
          EOF
