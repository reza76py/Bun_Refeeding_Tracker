server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single origin: the SPA and the API are served from the same host, so
    # Django session + CSRF cookies work without CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }

    # SPA fallback: unknown paths return index.html so React Router can route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
