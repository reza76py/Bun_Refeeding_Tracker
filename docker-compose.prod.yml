services:
  backend:
    image: ghcr.io/reza76py/bun_refeeding_tracker-backend:latest
    restart: unless-stopped
    env_file: ./.env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    volumes:
      - backend_data:/app/data
      - backend_static:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    image: ghcr.io/reza76py/bun_refeeding_tracker-frontend:latest
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_static:
